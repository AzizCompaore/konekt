{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONEKT | Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-civ-orange { background-color: #FF8200; }
        .text-civ-orange { color: #FF8200; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center font-sans">

    <div class="max-w-md w-full px-6">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-civ-orange tracking-tighter italic">KONEKT</h1>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-2">Espace Voyageur & Administration</p>
        </div>

        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-gray-100">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-6">
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2 ml-2">Identifiant</label>
                    <input type="text" name="username" required
                           class="w-full bg-gray-50 border border-gray-100 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-civ-orange transition-all font-bold text-gray-700">
                </div>

                <div class="mb-8">
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2 ml-2">Mot de passe</label>
                    <input type="password" name="password" required
                           class="w-full bg-gray-50 border border-gray-100 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-civ-orange transition-all font-bold text-gray-700">
                </div>

                {% if error %}
                <p class="text-red-500 text-xs font-bold mb-6 text-center italic">{{ error }}</p>
                {% endif %}

                <button type="submit"
                        class="w-full bg-black text-white font-black py-5 rounded-2xl hover:bg-civ-orange transition-all shadow-lg active:scale-95 uppercase text-xs tracking-widest">
                    Se connecter
                </button>
            </form>
        </div>

        <div class="text-center mt-8">
            <a href="{% url 'home' %}" class="text-gray-400 text-[10px] font-bold uppercase border-b border-gray-200 pb-1 hover:text-civ-orange transition-colors">
                Retour au réseau
            </a>
        </div>
    </div>

</body>
</html>
