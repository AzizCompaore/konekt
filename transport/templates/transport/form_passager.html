{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONEKT | Réservation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* Style pour l'effet de sélection des modes de paiement */
        .payment-radio:checked + label {
            border-color: #f97316; /* orange-500 */
            background-color: #fff7ed; /* orange-50 */
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 p-4 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-black p-8 text-white">
            <h1 class="text-3xl font-black italic tracking-tighter">KONEKT</h1>
            <p class="text-[10px] uppercase tracking-[0.3em] opacity-60 mt-1">Finalisez votre trajet</p>
        </div>

        <form action="{% url 'valider_reservation' voyage.id %}" method="POST" class="p-8 space-y-8">
            {% csrf_token %}

            <div class="bg-gray-50 rounded-2xl p-4 flex justify-between items-center border border-gray-100">
                <div class="overflow-hidden">
                    <p class="text-[9px] font-bold text-gray-400 uppercase">Trajet</p>
                    <p class="font-black text-gray-800 truncate">{{ gare_dep }} ➔ {{ gare_arr }}</p>
                </div>
                <div class="text-right">
                    <p class="text-[9px] font-bold text-gray-400 uppercase">Prix</p>
                    <p class="font-black text-orange-600">{{ prix }} FCFA</p>
                </div>
            </div>

            <input type="hidden" name="gare_dep" value="{{ gare_dep }}">
            <input type="hidden" name="gare_arr" value="{{ gare_arr }}">
            <input type="hidden" name="prix" value="{{ prix }}">

            <div class="space-y-4">
                <h3 class="text-xs font-black uppercase tracking-widest text-gray-400">Infos Passager</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold mb-1 ml-1 text-gray-500">NOM</label>
                        <input type="text" name="nom" required placeholder="Ex: Compaoré"
                               class="w-full bg-gray-50 border-2 border-transparent rounded-xl p-3 text-sm font-bold focus:border-orange-500 focus:bg-white outline-none transition">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold mb-1 ml-1 text-gray-500">PRÉNOM</label>
                        <input type="text" name="prenom" required placeholder="Ex: Abdoul"
                               class="w-full bg-gray-50 border-2 border-transparent rounded-xl p-3 text-sm font-bold focus:border-orange-500 focus:bg-white outline-none transition">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-xs font-black uppercase tracking-widest text-gray-400">Mode de Paiement</h3>
                <div class="grid grid-cols-3 gap-3">
                    <div class="relative">
                        <input type="radio" name="payment_mode" id="om" value="Orange" class="payment-radio hidden" required>
                        <label for="om" class="flex flex-col items-center justify-center p-3 border-2 border-gray-100 rounded-2xl cursor-pointer hover:bg-gray-50 transition-all h-full text-center">
                            <div class="w-10 h-10 bg-black rounded flex items-center justify-center text-[#FF7900] font-black text-xs mb-2">OM</div>
                            <span class="text-[9px] font-bold text-gray-700">Orange</span>
                        </label>
                    </div>

                    <div class="relative">
                        <input type="radio" name="payment_mode" id="momo" value="MTN" class="payment-radio hidden">
                        <label for="momo" class="flex flex-col items-center justify-center p-3 border-2 border-gray-100 rounded-2xl cursor-pointer hover:bg-gray-50 transition-all h-full text-center">
                            <div class="w-10 h-10 bg-[#FFCC00] rounded flex items-center justify-center text-blue-900 font-black text-[10px] mb-2">MOMO</div>
                            <span class="text-[9px] font-bold text-gray-700">MTN</span>
                        </label>
                    </div>

                    <div class="relative">
                        <input type="radio" name="payment_mode" id="wave" value="Wave" class="payment-radio hidden">
                        <label for="wave" class="flex flex-col items-center justify-center p-3 border-2 border-gray-100 rounded-2xl cursor-pointer hover:bg-gray-50 transition-all h-full text-center">
                            <div class="w-10 h-10 bg-[#1da1f2] rounded flex items-center justify-center text-white font-black text-[10px] mb-2">WAVE</div>
                            <span class="text-[9px] font-bold text-gray-700">Wave</span>
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-black text-white font-black py-4 rounded-2xl shadow-xl hover:bg-orange-600 transition active:scale-95 uppercase text-xs tracking-widest">
                Confirmer et Payer {{ prix }} FCFA
            </button>
        </form>
    </div>

</body>
</html>
